[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceproof"
version = "1.0.0"
description = "Face scan -> genuine web/social search -> blockchain-anchored, tamper-evident evidence"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

[project.scripts]
faceproof = "faceproof.cli:main"

[tool.setuptools.packages.find]
include = ["faceproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
